[project]
name = "solverforge"
version = "0.1.0"
description = "Autonomous AI agent for experimentally optimizing algorithms."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
solverforge = "solverforge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solverforge"]

[tool.ruff]
line-length = 100
target-version = "py311"